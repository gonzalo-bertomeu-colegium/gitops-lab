apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tetris
spec:
  ingressClassName: traefik
  rules:
    - host: tetris.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tetris
                port:
                  name: http
