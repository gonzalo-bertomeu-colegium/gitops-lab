apiVersion: apps/v1
kind: Deployment
metadata:
  name: game
spec:
  replicas: 5
  selector:
    matchLabels:
      app: game
  template:
    metadata:
      labels:
        app: game
    spec:
      containers:
        - name: game
          image: alexwhen/docker-2048
          ports:
            - name: http
              containerPort: 80
