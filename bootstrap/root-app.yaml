# App raíz (app-of-apps): lo único que se aplica a mano, una sola vez.
#   kubectl apply -f bootstrap/root-app.yaml
# Vigila apps/ y crea cada Application que encuentre ahí.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gonzalo-bertomeu-colegium/gitops-lab.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
